<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3C Search</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      margin:0;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      padding:20px;
    }

    .app{
      width:100%;
      max-width:700px;
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      font-size:42px;
    }

    .search-box{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:16px;
      border:none;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }

    button{
      padding:16px 24px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:16px;
      transition:0.2s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .result{
      margin-top:20px;
      background:#111827;
      padding:20px;
      border-radius:14px;
      min-height:150px;
      line-height:1.7;
      white-space:pre-wrap;
    }

    .loading{
      opacity:0.7;
    }

    .small{
      margin-top:12px;
      font-size:13px;
      color:#94a3b8;
      text-align:center;
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>3C Search</h1>

    <div class="search-box">
      <input
        id="query"
        placeholder="Example: food in hyderabad"
      />

      <button onclick="search3C()">
        Search
      </button>
    </div>

    <div class="small">
      Automatically returns top 3 results for anything you type
    </div>

    <div class="result" id="result">
      Type something and press Search...
    </div>
  </div>

<script>

const OPENAI_API_KEY = "PASTE_YOUR_OPENAI_API_KEY_HERE";

async function search3C() {

  const query = document.getElementById("query").value.trim();
  const resultDiv = document.getElementById("result");

  if(!query){
    resultDiv.innerHTML = "Please enter something.";
    return;
  }

  resultDiv.classList.add("loading");
  resultDiv.innerHTML = "Searching...";

  try {

    const prompt = `
You are a top 3 recommendation engine.

User query: "${query}"

Rules:
- Return ONLY the top 3 results.
- Keep response concise.
- Use numbered format.
- Include short descriptions.
`;

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${OPENAI_API_KEY}`
      },

      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.7
      })
    });

    const data = await response.json();

    const text =
      data.choices?.[0]?.message?.content ||
      "No results found.";

    resultDiv.innerHTML = text;

  } catch(err) {

    resultDiv.innerHTML =
      "Error: " + err.message;
  }

  resultDiv.classList.remove("loading");
}

document
  .getElementById("query")
  .addEventListener("keypress", function(e){

    if(e.key === "Enter"){
      search3C();
    }
  });

</script>

</body>
</html>
